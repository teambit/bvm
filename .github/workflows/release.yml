name: Release

# Manual releases only — this workflow never runs on push/merge.
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

# Never allow two releases to run at the same time.
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # bit.cloud token with export permissions to the teambit.bvm scope
      BIT_CONFIG_USER_TOKEN: ${{ secrets.BIT_TOKEN }}
      BIT_CONFIG_ANALYTICS_REPORTING: 'false'
      BIT_CONFIG_ANONYMOUS_REPORTING: 'false'
      BIT_CONFIG_INTERACTIVE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bit
        run: |
          # Pinned to 3.0.4: bvm 3.1.0's pnpm-engine install re-resolves Bit's
          # dependencies instead of using its lockfile, which breaks bit tag
          # (ERR_IMPORT_ATTRIBUTE_MISSING in the mdx/remark chain).
          npx @teambit/bvm@3.0.4 install
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Set up npm auth (packages are published during tag)
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Install dependencies
        run: bit install

      - name: Show status
        run: bit status

      - name: Run tests
        # Includes the hoisted-layout-integrity spec, which runs the
        # bundled @pnpm/napi engine for real and asserts the layout it
        # produces resolves version-conflicted dependencies correctly
        # (the bug class that shipped broken bit installs before 3.1.2).
        run: bit test

      - name: Tag components (${{ inputs.release-type }})
        run: bit tag --build --${{ inputs.release-type }} --message "bump ${{ inputs.release-type }} version"

      - name: Export components
        run: bit export

      - name: Read new bvm version
        id: version
        run: |
          VERSION=$(grep -A3 '"cli/app"' .bitmap | grep '"version"' | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Failed to read cli/app version from .bitmap" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "New bvm version: $VERSION"

      - name: Commit version bump and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bump version ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Verify the published package ships the tested engine
        # bvm is published as a bundle whose only runtime dependency is
        # @pnpm/napi. 3.1.1 shipped depending on an older engine than the
        # workspace was built and tested with (the bundle env hardcoded
        # the version), so compare the published stamp against the
        # version installed in this workspace and fail loudly on drift.
        run: |
          EXPECTED=$(node -p "require('@pnpm/napi/package.json').version")
          for i in $(seq 1 30); do
            PUBLISHED=$(npm view "@teambit/bvm@${{ steps.version.outputs.version }}" dependencies.@pnpm/napi 2>/dev/null || true)
            [ -n "$PUBLISHED" ] && break
            echo "waiting for @teambit/bvm@${{ steps.version.outputs.version }} to appear on the registry ($i)"
            sleep 10
          done
          echo "workspace engine: $EXPECTED, published dependency: $PUBLISHED"
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "Published @teambit/bvm depends on @pnpm/napi@$PUBLISHED but was built and tested with $EXPECTED" >&2
            exit 1
          fi

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
